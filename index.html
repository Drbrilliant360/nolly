<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restituta Kalanga | Social Media Content Creator</title>
    <meta
      name="description"
      content="Explore the creative work, promotional content, storytelling, and digital media projects of Restituta Kalanga, a Tanzania-based aspiring social media manager and digital content creator."
    />
    <meta name="theme-color" content="#FFF9F5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing. og-image.jpg is a 1200x630 card generated from the portrait.
         Most scrapers (WhatsApp, LinkedIn, Facebook) require ABSOLUTE image URLs: once the site has a
         domain, change both image URLs below to https://<domain>/og-image.jpg. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Restituta Kalanga | Social Media Content Creator" />
    <meta
      property="og:description"
      content="Creating Digital Content That Connects, Engages and Inspires. Promotional content, storytelling, and digital media by Restituta Kalanga, Dar es Salaam, Tanzania."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Restituta Kalanga, Social Media Content Creator and Digital Media Manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restituta Kalanga | Social Media Content Creator" />
    <meta
      name="twitter:description"
      content="Creating Digital Content That Connects, Engages and Inspires."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
